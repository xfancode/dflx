<!-- эксперемент над иконкой -->

<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="100" fill="#0f0c1f"/>
  <rect x="80" y="60" width="352" height="392" rx="20" fill="none" stroke="#8b5cf6" stroke-width="6"/>
  <text x="120" y="280" fill="#c4b5fd" font-family="monospace" font-size="72" font-weight="bold">>_</text>
  <circle cx="100" cy="100" r="4" fill="#8b5cf6">
    <animate attributeName="cx" values="100;400;100" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="100;100;100" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="150" r="3" fill="#c4b5fd">
    <animate attributeName="cx" values="200;350;200" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="150;300;150" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="200" r="5" fill="#a78bfa">
    <animate attributeName="cx" values="300;100;300" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="200;400;200" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/>
  </circle>
  <rect x="80" y="60" width="352" height="392" rx="20" fill="none" stroke="#8b5cf6" stroke-width="6">
    <animate attributeName="stroke-opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="230" y="280" fill="#c4b5fd" font-family="monospace" font-size="72" font-weight="bold">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    _
  </text>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="180;200;180" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
